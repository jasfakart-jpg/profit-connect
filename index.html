<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Profit Traders Developers Connect</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{--primary:#0D9488;--primary-dark:#0F766E;--secondary:#059669;--accent:#F59E0B;--danger:#EF4444;--bg:#F1F5F9;--bg-card:#fff;--text:#0F172A;--text-sec:#64748B;--border:#E2E8F0;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0B1120;--bg-card:#1E293B;--text:#F1F5F9;--text-sec:#94A3B8;--border:#334155;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;min-height:100vh}
h1,h2,h3{font-family:'Outfit',sans-serif;font-weight:700}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}
.hero{min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(135deg,#064E3B 0%,#0D9488 40%,#059669 70%,#064E3B 100%);display:flex;align-items:center;justify-content:center}
.hero-shape{position:absolute;border-radius:50%;opacity:.07;background:#fff;animation:fl 8s ease-in-out infinite}
.hero-shape:nth-child(1){width:400px;height:400px;top:-100px;left:-100px}
.hero-shape:nth-child(2){width:250px;height:250px;bottom:-50px;right:-50px;animation-delay:2s}
.hero-shape:nth-child(3){width:180px;height:180px;top:40%;right:15%;animation-delay:4s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-25px)}}
.login-wrap{position:relative;z-index:2;display:flex;gap:2.5rem;align-items:center;max-width:960px;width:100%;padding:2rem;flex-wrap:wrap;justify-content:center}
.hero-info{color:#fff;flex:1;min-width:280px}
.hero-info h1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;line-height:1.15;margin-bottom:.5rem}
.hero-info .tag{font-size:1.1rem;opacity:.8;margin-bottom:1rem;font-weight:300}
.hero-info .roles{opacity:.7;font-size:.9rem;line-height:1.8}
.hero-info .roles span{color:var(--accent);font-weight:600}
.lcard{background:var(--bg-card);border-radius:20px;padding:2.5rem;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.2);flex-shrink:0}
.lcard h2{text-align:center;font-size:1.5rem;margin-bottom:.15rem}
.lcard .sub{text-align:center;color:var(--text-sec);font-size:.88rem;margin-bottom:1.5rem}
.form-control{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:.7rem 1rem;font-size:.9rem;transition:border .2s}
.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
.form-label{font-size:.85rem;font-weight:600}
.btn-login{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:.7rem;font-weight:600;width:100%;transition:all .2s;font-size:.95rem;cursor:pointer}
.btn-login:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn-reg{background:var(--accent);color:#000;border:none;border-radius:10px;padding:.7rem;font-weight:600;width:100%;transition:all .2s;font-size:.95rem;cursor:pointer}
.btn-reg:hover{background:#D97706;transform:translateY(-1px)}
.divider{text-align:center;margin:1.25rem 0;position:relative;color:var(--text-sec);font-size:.85rem}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:38%;height:1px;background:var(--border)}
.divider::before{left:0}.divider::after{right:0}
.links{text-align:center;margin-top:1rem}.links a{color:var(--primary);font-weight:600;font-size:.85rem}
.toast-box{position:fixed;top:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem}
.toast-msg{padding:.85rem 1.25rem;border-radius:12px;color:#fff;font-size:.88rem;font-weight:500;display:flex;align-items:center;gap:.6rem;animation:si .3s ease;min-width:280px;box-shadow:0 8px 25px rgba(0,0,0,.15)}
.toast-msg.success{background:linear-gradient(135deg,#059669,#10B981)}
.toast-msg.error{background:linear-gradient(135deg,#DC2626,#EF4444)}
.toast-msg.info{background:linear-gradient(135deg,#0284C7,#0EA5E9)}
@keyframes si{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.loading-ov{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;z-index:9998;backdrop-filter:blur(2px)}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:768px){.hero-info{text-align:center}.login-wrap{padding:1rem}}
</style>
</head>
<body>
<div class="toast-box" id="toastBox"></div>
<div class="loading-ov" id="loadingOv"><div class="spinner"></div></div>
<section class="hero">
  <div class="hero-shape"></div><div class="hero-shape"></div><div class="hero-shape"></div>
  <div class="login-wrap">
    <div class="hero-info">
      <h1>Profit Traders<br>Developers Connect</h1>
      <p class="tag">Streamlined Work Report Management</p>
      <div class="roles"><span>Jhone Petter MD</span> — Owner & Managing Director<br><span>Kavi</span> — Manager</div>
    </div>
    <div class="lcard">
      <div class="text-center mb-2">
        <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem;margin-bottom:.5rem"><i class="fas fa-right-to-bracket"></i></div>
        <h2>Welcome Back</h2>
        <p class="sub">Sign in to your account</p>
      </div>
      <div class="mb-3"><label class="form-label">Email Address</label><input type="email" class="form-control" id="loginEmail" placeholder="you@company.com" autocomplete="email"></div>
      <div class="mb-3"><label class="form-label">Password</label>
        <div style="position:relative"><input type="password" class="form-control" id="loginPassword" placeholder="Enter password" autocomplete="current-password">
        <button type="button" onclick="togglePw()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-sec);cursor:pointer;padding:4px"><i class="fas fa-eye" id="pwIcon"></i></button></div>
      </div>
      <button class="btn-login" id="loginBtn" onclick="handleLogin()"><i class="fas fa-sign-in-alt"></i> Sign In</button>
      <div class="divider">or</div>
      <button class="btn-reg" onclick="window.location.href='register.html'"><i class="fas fa-user-plus"></i> Create Employee Account</button>
      <div style="text-align:center;margin-top:.75rem"><a href="#" onclick="openForgot();return false" style="color:var(--text-sec);font-size:.84rem">Forgot Password?</a></div>
    </div>
  </div>
</section>
<div class="modal fade" id="forgotModal" tabindex="-1"><div class="modal-dialog modal-sm"><div class="modal-content" style="background:var(--bg-card);border-radius:16px;border:1px solid var(--border)">
  <div class="modal-header" style="border-bottom:1px solid var(--border);padding:1.25rem"><h5 class="modal-title" style="font-weight:700">Reset Password</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" style="padding:1.25rem"><p style="font-size:.88rem;color:var(--text-sec);margin-bottom:1rem">Enter your email to receive a reset link.</p><input type="email" class="form-control" id="forgotEmail" placeholder="you@company.com"></div>
  <div class="modal-footer" style="border-top:1px solid var(--border);padding:1rem"><button class="btn-sm-custom btn-sm-outline" data-bs-dismiss="modal" style="padding:.4rem .8rem;border-radius:8px;font-size:.85rem;border:1px solid var(--border);background:transparent;color:var(--text-sec);cursor:pointer">Cancel</button><button onclick="sendReset()" style="padding:.4rem 1rem;border-radius:8px;font-size:.85rem;border:none;background:var(--primary);color:#fff;font-weight:600;cursor:pointer">Send Link</button></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
var firebaseConfig={apiKey:"AIzaSyDgLbow32QrQVq0lj8q7htfQrX80W8x-OU",authDomain:"workreports-5ed68.firebaseapp.com",projectId:"workreports-5ed68",storageBucket:"workreports-5ed68.firebasestorage.app",messagingSenderId:"696550085897",appId:"1:696550085897:web:5dd34faeb34a100318afd8",measurementId:"G-J3ML7PBLDS"};
firebase.initializeApp(firebaseConfig);
var auth=firebase.auth(),db=firebase.database();
/* Use SESSION persistence so logout works properly on GitHub Pages */
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

function toast(m,t){t=t||'info';var c=document.getElementById('toastBox');var ic={success:'fa-check-circle',error:'fa-times-circle',info:'fa-info-circle'};var d=document.createElement('div');d.className='toast-msg '+t;d.innerHTML='<i class="fas '+(ic[t]||ic.info)+'"></i> '+m;c.appendChild(d);setTimeout(function(){d.style.opacity='0';d.style.transform='translateX(100%)';d.style.transition='all .3s';setTimeout(function(){d.remove()},300)},3500)}
function showL(){document.getElementById('loadingOv').style.display='flex'}
function hideL(){document.getElementById('loadingOv').style.display='none'}
function togglePw(){var i=document.getElementById('loginPassword');var ic=document.getElementById('pwIcon');if(i.type==='password'){i.type='text';ic.className='fas fa-eye-slash'}else{i.type='password';ic.className='fas fa-eye'}}
function openForgot(){new bootstrap.Modal(document.getElementById('forgotModal')).show()}
async function sendReset(){var e=document.getElementById('forgotEmail').value.trim();if(!e){toast('Enter your email','error');return}showL();try{await auth.sendPasswordResetEmail(e);hideL();bootstrap.Modal.getInstance(document.getElementById('forgotModal')).hide();toast('Reset link sent','success')}catch(err){hideL();toast(err.message,'error')}}

/* Prevent auto-redirect: only redirect if explicitly logged in via this page */
var redirected=false;
async function handleLogin(){
  if(redirected)return;
  var email=document.getElementById('loginEmail').value.trim();
  var pass=document.getElementById('loginPassword').value;
  if(!email||!pass){toast('Please fill in all fields','error');return}
  showL();
  try{
    var cred=await auth.signInWithEmailAndPassword(email,pass);
    var uid=cred.user.uid;
    var adminSnap=await db.ref('admins/'+uid).once('value');
    if(adminSnap.exists()){
      redirected=true;hideL();toast('Welcome, Admin!','success');
      setTimeout(function(){window.location.href='admin.html'},600);return;
    }
    var empSnap=await db.ref('employees/'+uid).once('value');
    if(empSnap.exists()){
      redirected=true;hideL();toast('Welcome back!','success');
      setTimeout(function(){window.location.href='employee.html'},600);return;
    }
    await auth.signOut();hideL();toast('Account not recognized. Contact admin.','error');
  }catch(err){hideL();toast(err.message,'error')}
}

/* Load theme */
var sv=localStorage.getItem('ptdc-theme');if(sv)document.documentElement.setAttribute('data-theme',sv);

/* Handle Enter key on inputs */
document.getElementById('loginEmail').addEventListener('keydown',function(e){if(e.key==='Enter')handleLogin()});
document.getElementById('loginPassword').addEventListener('keydown',function(e){if(e.key==='Enter')handleLogin()});
</script>
</body>
</html>
